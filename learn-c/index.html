<style>

  --kuning: #FFF8E1; --kod: #263238;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--latar); color: var(--teks); line-height: 1.55; font-size: 15px; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 16px; }

a { color: var(--biru2); }

/* Hab */
.hero { background: linear-gradient(135deg,#1A237E,#3949AB); color: #fff; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
.hero h2 { font-size: 24px; color: #fff; }
.hero p { opacity: .9; margin-top: 6px; }
.p5 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.p5 span { background: rgba(255,255,255,.15); border-radius: 18px; padding: 5px 12px; font-size: 13px; }
.grid-topik { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.topik { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); cursor: pointer; border: 2px solid transparent; transition: transform .15s; position: relative; }
.topik:hover { transform: translateY(-2px); border-color: #C5CAE9; }

.nota-hab { font-size: 12.5px; color: var(--kelabu); margin-top: 14px; }

/* Langkah 5P */

.lk { flex: 1; min-width: 92px; border: 2px solid #C5CAE9; background: #fff; border-radius: 10px; padding: 8px 6px; cursor: pointer; text-align: center; font-weight: 600; color: var(--biru2); font-size: 13px; }
.lk span { display: block; font-size: 11px; font-weight: 400; color: var(--kelabu); }
.lk.aktif { background: var(--biru2); border-color: var(--biru2); color: #fff; }

.skrin { display: none; } .skrin.aktif { display: block; }
.kad { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 14px; }
h2 { font-size: 19px; color: var(--biru); margin-bottom: 8px; }
h3 { font-size: 15px; color: var(--biru); margin: 14px 0 6px; }
p { margin: 6px 0; }
ul.s { margin: 6px 0 6px 20px; } ul.s li { margin: 3px 0; }
.bm { color: var(--kelabu); font-size: 13.5px; font-style: italic; border-left: 3px solid #CFD8DC; padding-left: 10px; margin: 6px 0 10px; }
.bm::before { content: "BM: "; font-weight: 700; font-style: normal; }
.analogi { background: var(--kuning); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
code, pre { font-family: Consolas, 'Courier New', monospace; }
pre.kod { background: var(--kod); color: #ECEFF1; border-radius: 10px; padding: 14px; overflow-x: auto; font-size: 14px; line-height: 1.6; }
.hl1 { color: #90CAF9; font-weight: 700; } .hl2 { color: #FFB74D; font-weight: 700; } .hl3 { color: #CE93D8; font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }

.btn { border: none; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; }
.btn-pri { background: var(--biru2); color: #fff; } .btn-sec { background: var(--biru-muda); color: var(--biru); }

.nav { display: flex; justify-content: space-between; margin-top: 8px; gap: 8px; }
.soalan { margin: 14px 0; padding: 14px; border: 1px solid #E0E0E0; border-radius: 12px; }
.soalan .q { font-weight: 600; margin-bottom: 8px; }
.pil { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; border: 1.5px solid #CFD8DC; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; font-family: inherit; }
.pil:hover { border-color: var(--biru2); }

.pil.salah { background: var(--merah-muda); border-color: var(--merah); }
.mb { display: none; margin-top: 8px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
.mb.ok { display: block; background: var(--hijau-muda); } .mb.no { display: block; background: var(--merah-muda); }

.kawal { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
/* Tracer */
.ln { display: block; padding: 0 4px; border-radius: 4px; min-height: 1.6em; }
.ln.on { background: rgba(255,235,59,.22); outline: 1px solid rgba(255,235,59,.6); }
.pt.on { background: #FFEB3B; color: #1A1A2E; border-radius: 3px; }
.terang { background: var(--biru-muda); border-radius: 10px; padding: 10px 12px; min-height: 66px; margin-top: 8px; }
.terang .bm { margin: 4px 0 0; }
.konsol { background: #000; color: #A5D6A7; font-family: Consolas, monospace; border-radius: 8px; padding: 10px; min-height: 44px; margin-top: 8px; white-space: pre-wrap; font-size: 13.5px; }
.konsol .inp { color: #FFF59D; }
.jadual-trace { max-height: 280px; overflow: auto; margin-top: 8px; border: 1px solid #E0E0E0; border-radius: 8px; }
.jadual-trace table { font-size: 12.5px; }
.jadual-trace th { position: sticky; top: 0; white-space: nowrap; }
.jadual-trace tr.baru td { background: #FFFDE7; font-weight: 600; }
.T { color: var(--hijau); font-weight: 700; } .F { color: var(--merah); font-weight: 700; }
svg.fc { width: 100%; max-width: 360px; display: block; margin: 0 auto; }
.fc .nd { fill: #fff; stroke: #455A64; stroke-width: 2; transition: fill .2s; }
.fc .nd.on { fill: #FFEB3B; stroke: #F57F17; }
.fc text { font-family: Consolas, monospace; font-size: 12.5px; text-anchor: middle; dominant-baseline: middle; }
.fc .lbl { font-family: 'Segoe UI', Arial; font-size: 12px; font-weight: 700; }
.fc line, .fc polyline { stroke: #455A64; stroke-width: 2; fill: none; }
.simbol { font-size: 12.5px; color: var(--kelabu); margin-top: 6px; }
/* Panel tambahan: tatasusunan, memori, stack */
.arr { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
.arr div { border: 2px solid #90A4AE; border-radius: 6px; min-width: 52px; text-align: center; padding: 4px; background: #fff; font-family: Consolas, monospace; }
.arr div small { display: block; font-size: 11px; color: var(--kelabu); }
.arr div.on { background: #FFEB3B; border-color: #F57F17; }
.mem { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 6px 0; }
.mem div { border: 2px solid #90A4AE; border-radius: 8px; padding: 6px 8px; font-family: Consolas, monospace; background: #fff; font-size: 13px; }
.mem div b { font-size: 15px; } .mem div small { display: block; color: var(--kelabu); font-size: 11px; }
.mem div.on { background: #FFEB3B; border-color: #F57F17; }
.mem div.ptr { border-style: dashed; border-color: #6A1B9A; }
.stack div { border: 2px solid #90A4AE; border-radius: 8px; padding: 6px 10px; margin: 6px 0; background: #fff; font-family: Consolas, monospace; font-size: 13px; }
.stack div.on { border-color: #F57F17; background: #FFFDE7; }
.stack div b { font-family: 'Segoe UI', Arial; }
footer { text-align: center; font-size: 12px; color: #90A4AE; padding: 18px 0 28px; }

function binaKod(m) {

    while ((x = re.exec(baris))) { html += esc(baris.slice(last, x.index)) + '<span class="pt" id="P-' + x[1] + '">' + esc(x[2]) + '</span>'; last = re.lastIndex; }
    html += esc(baris.slice(last));
    return '<span class="ln" id="L' + (i + 1) + '">' + (html || " ") + '</span>';
  }).join("");
}

function runCurated(id,v){

function flowDraw(graph,title,idx){
 const nodes=graph.nodes,edges=graph.edges;
 const maxX=Math.max(...nodes.map(n=>n.x+n.w))+48,maxY=Math.max(...nodes.map(n=>n.y+n.h))+42;
 const uid='flowArrow-'+idx;
 const point=(n,side)=>side==='top'?[n.x+n.w/2,n.y]:side==='bottom'?[n.x+n.w/2,n.y+n.h]:side==='left'?[n.x,n.y+n.h/2]:[n.x+n.w,n.y+n.h/2];
 const renderNode=n=>{const {x,y,w,h,t}=n;let shape='';let fill='#eeebff',stroke='#6857ba';
 if(t==='terminal'||t==='return')shape=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
 if(t==='process')shape=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="#e9f7ec" stroke="#398c6a" stroke-width="2.5"/>`;
 if(t==='subroutine')shape=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="#e7edff" stroke="#4f63b5" stroke-width="2.5"/><line x1="${x+13}" y1="${y}" x2="${x+13}" y2="${y+h}" stroke="#4f63b5" stroke-width="2.5"/><line x1="${x+w-13}" y1="${y}" x2="${x+w-13}" y2="${y+h}" stroke="#4f63b5" stroke-width="2.5"/>`;
 if(t==='io')shape=`<polygon points="${x+28},${y} ${x+w},${y} ${x+w-28},${y+h} ${x},${y+h}" fill="#dff7f1" stroke="#249a89" stroke-width="2.5"/>`;
 if(t==='decision')shape=`<polygon points="${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}" fill="#fff1d7" stroke="#e6a53c" stroke-width="2.5"/>`;
 // Width-aware text wrapping, preserving operators and short code identifiers.
 const maxChars=t==='decision'?24:Math.max(19,Math.floor(w/8.5));const words=n.label.split(' ');const lines=[];let l='';for(const word of words){if((l+' '+word).trim().length>maxChars&&l){lines.push(l);l=word;}else l+=(l?' ':'')+word;}if(l)lines.push(l);
 const lines2=lines.slice(0,3),y0=y+h/2-((lines2.length-1)*8);
 return `<g class="flow-node" data-type="${t}">${shape}<text x="${x+w/2}" y="${y0}" text-anchor="middle" dominant-baseline="middle" fill="#252950" font-weight="650" font-size="13" font-family="Segoe UI,Arial">${lines2.map((v,i)=>`<tspan x="${x+w/2}" dy="${i?17:0}">${esc(v)}</tspan>`).join('')}</text></g>`;};
 const renderEdge=e=>{const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)return '';const P=[point(a,e.from),...e.via,point(b,e.to)];const d=P.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' ');let lab='';if(e.label){const start=P[0],end=P[1],mx=(start[0]+end[0])/2,my=(start[1]+end[1])/2;lab=`<text x="${mx+(e.from==='right'?3:e.from==='left'?-3:33)}" y="${my-7}" font-size="12" font-weight="800" text-anchor="middle" fill="#5545ac">${esc(e.label)}</text>`;}return `<path d="${d}" stroke="#5b64a3" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#${uid})"/>${lab}`;};
 return `<section class="flow-section"><h3>${esc(title)}</h3><div class="flowbox"><svg role="img" aria-label="${esc(title)}" width="${maxX}" height="${maxY}" viewBox="0 0 ${maxX} ${maxY}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="${uid}" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5b64a3"/></marker></defs>${edges.map(renderEdge).join('')}${nodes.map(renderNode).join('')}</svg></div></section>`;
}
function diagram(e){const graphs=flowSpec(e.id);const names=graphs.length>1?['Flowchart: main()','Flowchart: '+(e.id==='function'?'addNumbers()':e.id==='square'?'square()':'swap()')]:['Flowchart: '+e.title];return graphs.map((g,i)=>flowDraw(g,names[i],e.id+'-'+i)).join('')+'<p class="flow-note">Legend: rounded terminal = Start / End; parallelogram = Input / Output; rectangle = Process; diamond = Decision; double-sided rectangle = Predefined Process (function call). Return transfers control back to the caller; it is rendered as a terminal return step in function flowcharts.</p>';}

function flowPractice(){var q=PRACTICE_BANK[PRACTICE_Q%PRACTICE_BANK.length];return '<div class="flow-practice"><p><b>Question '+(PRACTICE_Q+1)+' / '+PRACTICE_BANK.length+'</b> — '+esc(q[0])+'</p><select id="flow-answer"><option value="">Choose an answer</option><option value="oval">Oval / Terminator</option><option value="para">Parallelogram / I-O</option><option value="rect">Rectangle / Process</option><option value="diamond">Diamond / Decision</option><option value="subroutine">Double-line Rectangle / Function Call</option></select> <button class="btn btn-pri" onclick="checkFlowPractice()">Check</button><p id="flow-feedback" aria-live="polite"></p></div>';}
function checkFlowPractice(){var answer=$('flow-answer').value,q=PRACTICE_BANK[PRACTICE_Q%PRACTICE_BANK.length],feedback=$('flow-feedback');if(!answer){feedback.textContent='Choose an answer first.';return;}if(answer===q[1]){feedback.innerHTML='✅ Correct! <button class="btn btn-sec" onclick="PRACTICE_Q=(PRACTICE_Q+1)%PRACTICE_BANK.length;STUDIO_VIEW=\'flow\';studioRender()">Next question →</button>';}else feedback.textContent='❌ Try again. Think about the purpose of this step.';}
